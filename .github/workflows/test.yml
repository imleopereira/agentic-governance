name: tests

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_call:

# dorny/paths-filter needs `pull-requests: read` to call the PR changed-files
# API; without it the action fails with "Resource not accessible by
# integration" on every PR event. `contents: read` is the least-privilege
# default for the rest of the workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    name: unit tests + lint + types (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,otel,console]"
      - name: ruff
        run: python -m ruff check src/ tests/
      - name: mypy
        run: python -m mypy --strict src/codeatelier_governance/
      - name: pytest (unit only)
        run: python -m pytest tests/ -q

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: governance_qa
          POSTGRES_USER: governance
          POSTGRES_PASSWORD: governance
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U governance -d governance_qa"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      GOVERNANCE_QA_DB_URL: postgresql://governance:governance@localhost:5435/governance_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # [migrations] extra brings in psycopg (v3) — required by the
          # seeded-DB integration test which spins a Docker Postgres and
          # imports psycopg directly to wait for readiness.
          python -m pip install -e ".[dev,otel,console,migrations]"
      - name: apply DDL
        run: |
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/audit/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/cost/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/gates/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/console/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/loop/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/presence/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/scope/ddl.sql
      - name: integration tests
        run: python -m pytest tests/ -q -m integration

  console-typecheck:
    name: console tsc --noEmit
    runs-on: ubuntu-latest
    # Path filter: only run when console/** changes on PRs. Push events
    # (branches: production) always run as a safety net so main never
    # drifts. F8 item 8 of the v0.6 PRD — gate added in standalone PR
    # before any other v0.6 feature branch opens to avoid cascading CI
    # breakage on pre-existing TS errors.
    steps:
      - uses: actions/checkout@v4
      - name: detect console changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            console:
              - 'console/**'
              - '.github/workflows/test.yml'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.console == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - name: install console deps
        if: github.event_name == 'push' || steps.changes.outputs.console == 'true'
        working-directory: console
        run: npm ci
      - name: tsc --noEmit
        if: github.event_name == 'push' || steps.changes.outputs.console == 'true'
        working-directory: console
        run: npm run typecheck

  console-llm-theater-tripwire:
    name: console LLM-theater tripwire (source-grep tests)
    runs-on: ubuntu-latest
    # v0.6 PRD F7 set a tripwire at 5 instances of the "source-grep
    # test" pattern — a test that `readFileSync`-s a component file
    # and regex-matches it for structural tokens, instead of rendering
    # the component and asserting on runtime behaviour. The team shipped
    # 8 such files in v0.6 (process breach disclosed in CHANGELOG).
    #
    # v0.6.1 polish sprint closes that breach: all 8 files were
    # rewritten to render + assert, and this job makes a regression
    # impossible. The count of `readFileSync` occurrences in console
    # *.test.ts / *.test.tsx files MUST remain at 0 on every push. One
    # new source-grep test in a PR is enough to fail this job.
    steps:
      - uses: actions/checkout@v4
      - name: count source-grep tests
        run: |
          # DA v0.6.1: broaden the tripwire from ``readFileSync`` only to
          # ANY fs-read helper that a test might use to pull a component
          # file off disk. Covers:
          #   * readFileSync (sync fs)
          #   * readFile     (both node:fs/promises and callback-form)
          #   * import("fs") / require("fs")
          # Security v0.6.1: widened quote handling and subpath variants.
          # Single-quoted imports (`from 'fs'`) and `fs/promises` subpaths
          # previously bypassed the tripwire. The new regex treats the
          # quote as any of "'` and matches `fs`, `fs/…`, `node:fs`, or
          # `node:fs/…` so every realistic fs-read path trips the gate.
          # A matching line in ANY *.test.ts / *.test.tsx file under
          # console/src fails the job. `grep -l` exits 1 when nothing
          # matches; `|| true` keeps the pipeline's exit status pinned to
          # the `wc -l` step.
          # Pattern built piece-by-piece to avoid single-quote escaping
          # hell. `q` is the character class of quote styles JS/TS allows
          # (double, single, backtick). Subpath variants (`fs/promises`,
          # `node:fs/promises`) and the dynamic `import("fs")` form are
          # all covered.
          q='["'"'"'`]'
          pattern="readFileSync|readFile\(|from[[:space:]]+${q}(node:)?fs(/[a-z]+)?${q}|require\([[:space:]]*${q}(node:)?fs(/[a-z]+)?${q}[[:space:]]*\)|import\([[:space:]]*${q}(node:)?fs(/[a-z]+)?${q}[[:space:]]*\)"
          count=$(grep -rlE "$pattern" console/src --include="*.test.ts" --include="*.test.tsx" 2>/dev/null | wc -l || true)
          count=${count// /}
          echo "source-grep test-file count: $count"
          if [ "$count" -gt 0 ]; then
            echo "LLM-theater tripwire: $count source-grep tests found"
            grep -rnE "$pattern" console/src --include="*.test.ts" --include="*.test.tsx" || true
            exit 1
          fi

  package:
    name: clean-venv install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build wheel
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel . --no-deps -w dist/
      - name: install in fresh venv
        run: |
          python -m venv test-venv
          test-venv/bin/python -m pip install --upgrade pip
          test-venv/bin/python -m pip install dist/*.whl
      - name: smoke test (no source tree)
        run: |
          # Read the authoritative version from pyproject.toml so this
          # step never needs to be edited on a release bump.  The smoke
          # test asserts the installed wheel's __version__ matches what
          # pyproject.toml declared at build time — catches stale-wheel
          # and mis-stamped-build bugs without hardcoding a version.
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "expected version from pyproject.toml: $EXPECTED_VERSION"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          ${{ github.workspace }}/test-venv/bin/python -c "
          import codeatelier_governance, importlib.resources as res
          expected = '$EXPECTED_VERSION'
          actual = codeatelier_governance.__version__
          assert actual == expected, f'version mismatch: wheel={actual!r} pyproject={expected!r}'
          assert (res.files('codeatelier_governance.audit') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.cost') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.gates') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.scope') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.console') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.loop') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.presence') / 'ddl.sql').is_file()
          from codeatelier_governance.integrations.anthropic_wrap import wrap_anthropic
          print('clean install OK:', codeatelier_governance.__version__)
          "

  validate-cron-artifacts:
    name: validate cron artifacts
    runs-on: ubuntu-latest
    # F7 sub-item #2: tree-diff any cron artifact under automation/
    # against automation/.cron-baseline.json. Runs in CI, NOT as a
    # cron job (the DX Consultant fix — running a cron-validator
    # from cron is a circular dependency). As of v0.6 there are no
    # cron artifacts checked in, so this job is a no-op stub that
    # exits 0 with a WARN. It gains teeth automatically when
    # automation/ is populated.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: validate
        run: python automation/lib/validate_cron_artifacts.py

  console-version-parity:
    name: console version parity (app.py vs package.json)
    runs-on: ubuntu-latest
    # F7 sub-item #7: the FastAPI ``app = FastAPI(version=...)`` and
    # the Next.js console ``package.json`` must agree. A drift here
    # means the served API metadata and the built-client bundle
    # report different versions, which breaks the observability
    # story on the dashboard. This job greps both files and fails
    # if they don't match.
    steps:
      - uses: actions/checkout@v4
      - name: assert versions match
        run: |
          APP_VERSION=$(grep -oE 'version="[0-9]+\.[0-9]+\.[0-9]+"' \
            src/codeatelier_governance/console/app.py \
            | head -1 | sed -E 's/version="([^"]+)"/\1/')
          PKG_VERSION=$(python -c "import json; \
            print(json.load(open('console/package.json'))['version'])")
          echo "app.py   version: $APP_VERSION"
          echo "package  version: $PKG_VERSION"
          if [ -z "$APP_VERSION" ] || [ -z "$PKG_VERSION" ]; then
            echo "ERROR: could not extract one or both versions"
            exit 1
          fi
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: console version drift detected"
            exit 1
          fi
          echo "OK: console versions match ($APP_VERSION)"
