name: tests

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_call:

# dorny/paths-filter needs `pull-requests: read` to call the PR changed-files
# API; without it the action fails with "Resource not accessible by
# integration" on every PR event. `contents: read` is the least-privilege
# default for the rest of the workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    name: unit tests + lint + types (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,otel]"
      - name: ruff
        run: python -m ruff check src/ tests/
      - name: mypy
        run: python -m mypy --strict src/codeatelier_governance/
      - name: pytest (unit only)
        run: python -m pytest tests/ -q

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: governance_qa
          POSTGRES_USER: governance
          POSTGRES_PASSWORD: governance
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U governance -d governance_qa"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      GOVERNANCE_QA_DB_URL: postgresql://governance:governance@localhost:5435/governance_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          # [migrations] extra brings in psycopg (v3) — required by the
          # seeded-DB integration test which spins a Docker Postgres and
          # imports psycopg directly to wait for readiness.
          python -m pip install -e ".[dev,otel,migrations]"
      - name: apply DDL
        run: |
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/audit/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/cost/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/gates/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/loop/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/presence/ddl.sql
          PGPASSWORD=governance psql -h localhost -p 5435 -U governance -d governance_qa \
            -f src/codeatelier_governance/scope/ddl.sql
      - name: integration tests
        run: python -m pytest tests/ -q -m integration

  package:
    name: clean-venv install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build wheel
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel . --no-deps -w dist/
      - name: install in fresh venv
        run: |
          python -m venv test-venv
          test-venv/bin/python -m pip install --upgrade pip
          test-venv/bin/python -m pip install dist/*.whl
      - name: smoke test (no source tree)
        run: |
          # Read the authoritative version from pyproject.toml so this
          # step never needs to be edited on a release bump.  The smoke
          # test asserts the installed wheel's __version__ matches what
          # pyproject.toml declared at build time — catches stale-wheel
          # and mis-stamped-build bugs without hardcoding a version.
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "expected version from pyproject.toml: $EXPECTED_VERSION"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          ${{ github.workspace }}/test-venv/bin/python -c "
          import codeatelier_governance, importlib.resources as res
          expected = '$EXPECTED_VERSION'
          actual = codeatelier_governance.__version__
          assert actual == expected, f'version mismatch: wheel={actual!r} pyproject={expected!r}'
          assert (res.files('codeatelier_governance.audit') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.cost') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.gates') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.scope') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.loop') / 'ddl.sql').is_file()
          assert (res.files('codeatelier_governance.presence') / 'ddl.sql').is_file()
          from codeatelier_governance.integrations.anthropic_wrap import wrap_anthropic
          print('clean install OK:', codeatelier_governance.__version__)
          "
