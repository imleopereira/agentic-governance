[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatelier-governance"
version = "0.4.0"
description = "Enforcement gates for AI agents — five lines, in-process, just Postgres"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Code Atelier" },
]
keywords = [
    "ai", "agents", "governance", "audit", "hmac", "compliance",
    "llm", "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Framework :: AsyncIO",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "structlog>=24.0",
    "alembic>=1.13",
    "greenlet>=3.0",
]

[project.urls]
Homepage = "https://github.com/imleopereira/code-atelier-governance"
Documentation = "https://github.com/imleopereira/code-atelier-governance/blob/production/README.md"
Issues = "https://github.com/imleopereira/code-atelier-governance/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
langchain = [
    "langchain-core>=0.2",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
    "coverage",
    "httpx>=0.27",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]
publish = [
    "build",
    "twine",
]

[project.scripts]
governance = "codeatelier_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"codeatelier_governance" = ["py.typed"]
"codeatelier_governance.audit" = ["*.sql"]
"codeatelier_governance.cost" = ["*.sql"]
"codeatelier_governance.gates" = ["*.sql"]
"codeatelier_governance.scope" = ["*.sql"]
"codeatelier_governance.console" = ["*.sql"]
"codeatelier_governance.loop" = ["*.sql"]
"codeatelier_governance.presence" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running QA Postgres at :5435",
]
# Skip integration tests by default — opt in with `pytest -m integration`
addopts = "-m 'not integration'"
