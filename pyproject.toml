[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atelier-governance"
version = "0.7.2"
description = "Enforcement gates for AI agents — five lines, in-process, just Postgres"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Code Atelier" },
]
keywords = [
    "ai", "agents", "governance", "audit", "hmac", "compliance",
    "llm", "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Framework :: AsyncIO",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "structlog>=24.0",
    "alembic>=1.13",
    "greenlet>=3.0",
    "cryptography>=46.0.7,<47.0",
]

[project.urls]
Homepage = "https://github.com/imleopereira/code-atelier-governance"
Documentation = "https://github.com/imleopereira/code-atelier-governance/blob/production/README.md"
Issues = "https://github.com/imleopereira/code-atelier-governance/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]
langchain = [
    "langchain-core>=0.2",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.30",
]
# v0.7.0 platform bridge: dual-write audit events to the Code Atelier
# platform's ingest endpoint. httpx only — no new CA bundle or TLS
# library; httpx brings certifi transitively. Keep the version pin
# tight so a future httpx major can't silently relax TLS defaults.
platform = [
    "httpx>=0.27,<1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
    "coverage",
    "httpx>=0.27",
    # v0.7.0 platform-bridge unit tests: mock httpx requests without a
    # live platform so SDK CI can verify forward/retry/auth behavior.
    "respx>=0.21",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
]
publish = [
    "build",
    "twine",
]
# Alembic's migrations/env.py runs in sync mode (Alembic has no async
# runner). The SDK's runtime path uses asyncpg, but asyncpg cannot be
# used as a SQLAlchemy sync driver, so migration runs need a sync
# Postgres driver. psycopg3 is the actively-maintained successor to
# psycopg2 and ships a smaller wheel. Install with:
#     pip install "code-atelier-governance[migrations]"
# See docs/migrations.md for details. Do NOT add psycopg to the core
# runtime dependencies — that would pull ~3MB into every install just
# to cover a one-shot `alembic upgrade head` operation.
migrations = [
    "psycopg[binary]>=3.1,<4.0",
]

[project.scripts]
governance = "codeatelier_governance.cli:main"
# v0.7.2: alternate entry point for distribution-first messaging. Same
# argparse dispatcher as ``governance`` — both names are stable.
codeatelier-governance = "codeatelier_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Include the migrations package so alembic's env.py, script.py.mako, and
# every versions/*.py file are shipped inside the wheel. Fresh installs
# need these to run ``alembic upgrade head`` at ``governance migrate``
# time — without them the CLI silently falls back to the v0.5 schema
# and every audit write raises StoreUnavailableError. See docs/migrations.md.
include = ["codeatelier_governance*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# ``alembic.ini`` + ``migrations/**`` are packaged as data files so the
# CLI can resolve them via ``importlib.resources.files`` at runtime.
# This mirrors the repo layout: ``src/codeatelier_governance/alembic.ini``
# and ``src/codeatelier_governance/migrations/``. Without these globs
# setuptools drops the non-``.py`` files (``alembic.ini``, ``*.mako``,
# the ``README`` Alembic generates) from the wheel.
"codeatelier_governance" = ["py.typed", "alembic.ini"]
"codeatelier_governance.audit" = ["*.sql"]
"codeatelier_governance.cost" = ["*.sql"]
"codeatelier_governance.gates" = ["*.sql"]
"codeatelier_governance.scope" = ["*.sql"]
"codeatelier_governance.loop" = ["*.sql"]
"codeatelier_governance.presence" = ["*.sql"]
"codeatelier_governance.migrations" = ["*.py", "*.mako", "README"]
"codeatelier_governance.migrations.versions" = ["*.py"]
# v0.7 F3 Agent Recipe CLI: ship templates as package data so
# ``governance init agent-<kind>`` can read them via importlib.resources
# regardless of install mode (wheel vs editable).
"codeatelier_governance.cli.recipes" = ["*.py.tmpl"]
# v0.7.2 multi-file recipe scaffolder (``codeatelier-governance recipe
# agt <path>``). Templates cover every scaffold file type, so the glob
# is broad (``*.tmpl``) rather than ``.py.tmpl``-only.
"codeatelier_governance.recipes.agt" = ["*.tmpl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running QA Postgres at :5435",
]
# Skip integration tests by default — opt in with `pytest -m integration`
addopts = "-m 'not integration'"
