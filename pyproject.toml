[project]
name = "codeatelier-governance"
version = "0.1.0"
description = "Enterprise-grade governance SDK for AI agent deployments"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "structlog>=24.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "coverage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
